project_id = "wnfeeyvanzesfdxvnkvf"

# listing-share serves public Open Graph preview pages to social-media
# crawlers, which send no auth headers — JWT verification must be off.
[functions.listing-share]
verify_jwt = false

# dpo-callback is the browser redirect target from the DPO hosted
# payment page — no auth headers exist on a redirect.
[functions.dpo-callback]
verify_jwt = false

# Scheduled tenancy jobs are invoked by the scheduler with
# `Authorization: Bearer <CRON_SECRET>` — a shared secret, not a JWT.
# They enforce CRON_SECRET themselves (same shape as
# scheduled-settlement), so gateway JWT verification stays off.
[functions.process-tenancy-expiry]
verify_jwt = false

[functions.send-tenancy-expiry-reminders]
verify_jwt = false

# scheduled-settlement is invoked by pg_cron (migration 038) with
# `Authorization: Bearer <CRON_SECRET>` — a shared secret, not a JWT.
# The function enforces CRON_SECRET itself (and fails closed when the
# secret is unset), so gateway JWT verification stays off.
[functions.scheduled-settlement]
verify_jwt = false
